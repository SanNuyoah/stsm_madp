task_type: wheelchair
task_mode: navigation
experiment_mode: paper
base_config: wheelchair_control.yaml
topology_config: topology.yaml
morse_roles:
  minima: waiting_or_parking_region
  saddle: wheelchair_connection_channel
semantic_constraints:
  enforce_waiting_parking: true
  footprint_risk_enabled: true
outputs:
  topology_summary: results/run/topology_summary.json
  trajectory: results/run/wheelchair/trajectory.csv
  metrics: results/run/metrics/wheelchair_metrics.csv

mpc:
  horizon: 12
  dt: 0.2
  a_max: 0.5
  alpha_max: 1.5
  beam_width: 12
  optimizer: sampled_beam_sequence
  pure_pursuit_role: baseline_or_warm_start
  first_step_progress_ratio: 0.50
  heading_recovery_w_max: 0.95
  tube_constraint_mode: hard
  failure_policy: safe_stop
